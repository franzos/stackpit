name: Fuzz

# Weekly libFuzzer campaign over the parsers that see attacker-controlled
# input (fuzz/fuzz_targets). cargo-fuzz needs nightly for the sanitizer
# flags, so this never runs on PRs; `make fuzz` reproduces a target locally.
on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [envelope, event_data, telemetry, artifact_bundle, sentry_auth, client_ip, locale]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz for 15 minutes
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=900 -timeout=30
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
