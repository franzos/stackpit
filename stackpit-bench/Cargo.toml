[package]
name = "stackpit-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Open-loop ingestion benchmark for stackpit (SQLite, Postgres)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
charts-rs = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[dev-dependencies]
tempfile = "3"
