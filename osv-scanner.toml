reason = "rsa via openidconnect: Marvin attack targets RSA decryption; Stackpit only verifies RS256 signatures with public keys"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 via elliptic-curve 0.13: timing leaks on secret operands; Stackpit only verifies ES256/ES384 signatures with public keys"

[[IgnoredVulns]]
